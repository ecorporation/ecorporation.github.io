<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} — {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>

<body>

  <div class="page">

    <header>
      <h1>
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </h1>

      <p>
        Satellite security and Hack-A-Sat research.
      </p>

      <nav>
        <a href="{{ '/' | relative_url }}">Home</a> |
        <a href="{{ '/archive/' | relative_url }}">Archive</a> |
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </header>

    <hr>

    <main>
      {{ content }}
    </main>

    <hr>

    <footer>
      <p>
        This website intentionally resembles an early graphical web portal.
      </p>
    </footer>

  </div>

</body>
</html>
